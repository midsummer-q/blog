<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="开发工具如何协作">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52637b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" rx="20" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="62" font-size="32" font-weight="700" fill="#172b4d">开发工具如何协作</text>
<text x="48" y="105" font-size="21" fill="#52637b">从源码到程序，再把修改过程变成可追踪、可重复的工作。</text>
<rect x="48" y="150" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="188" font-size="25" fill="#2563eb" font-weight="700">包管理</text>
<text x="68" y="226" font-size="22" fill="#172b4d">安装工具与库</text>
<text x="68" y="257" font-size="22" fill="#172b4d">仓库、依赖、版本</text>
<rect x="450" y="150" width="702" height="130" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="470" y="188" font-size="25" fill="#0f766e" font-weight="700">Make：组织构建</text>
<text x="470" y="226" font-size="22" fill="#172b4d">读取 Makefile 中的依赖与配方</text>
<text x="470" y="257" font-size="22" fill="#172b4d">决定哪些目标需要更新，并调用编译器等工具</text>
<rect x="48" y="365" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="403" font-size="25" fill="#2563eb" font-weight="700">Vim：编辑源码</text>
<text x="68" y="441" font-size="22" fill="#172b4d">修改 .c、.h 与构建配置</text>
<rect x="450" y="365" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="403" font-size="25" fill="#2563eb" font-weight="700">GCC / G++</text>
<text x="470" y="441" font-size="22" fill="#172b4d">转换源码并完成链接</text>
<rect x="852" y="365" width="300" height="130" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="872" y="403" font-size="25" fill="#0f766e" font-weight="700">可执行程序</text>
<text x="872" y="441" font-size="22" fill="#172b4d">运行并观察行为</text>
<path d="M 348 430 L 450 430" fill="none" stroke="#52637b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 750 430 L 852 430" fill="none" stroke="#52637b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 600 280 L 600 365" fill="none" stroke="#52637b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="620" y="329" font-size="21" fill="#52637b">调用</text>
<rect x="48" y="610" width="440" height="110" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="648" font-size="25" fill="#2563eb" font-weight="700">Git：记录与协作</text>
<text x="68" y="686" font-size="22" fill="#172b4d">保存源码和构建配置的版本</text>
<rect x="712" y="610" width="440" height="110" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="732" y="648" font-size="25" fill="#0f766e" font-weight="700">GDB：定位问题</text>
<text x="732" y="686" font-size="22" fill="#172b4d">断点、变量与调用栈</text>
<path d="M 1002 495 L 1002 610" fill="none" stroke="#52637b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 712 665 L 600 665 L 600 550 L 198 550 L 198 495" fill="none" stroke="#52637b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="260" y="542" font-size="21" fill="#52637b">把诊断结果带回源码</text>
<text x="48" y="792" font-size="18" fill="#52637b">概念示意 · Make 是构建调度工具，不是编译流水线中的独立转换阶段。</text>
</g></svg>
