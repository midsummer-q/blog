<svg xmlns="http://www.w3.org/2000/svg" width="940" height="395" viewBox="0 0 940 395" role="img" aria-labelledby="title desc">
<title id="title">同一个虚拟地址，两份私有数据</title><desc id="desc">以一页可写的私有数据为例。地址与数值仅用于示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536c7c"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203749}.title{font-weight:700;font-size:28px}.sub,.note{font-size:17px;fill:#485e6c}.body,.mono,.label{font-size:20px}.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-weight:700}.label{font-weight:700;fill:#165e5a}.a,.rail,.wait{stroke:#536c7c;stroke-width:2.5;fill:none;stroke-linejoin:round}.a{marker-end:url(#arrow)}.wait{stroke-dasharray:6 5}</style>
<rect width="940" height="395" rx="16" fill="#f9fbfb"/><text x="30" y="48" class="title" text-anchor="start">同一个虚拟地址，两份私有数据</text><text x="30" y="84" class="sub" text-anchor="start">以一页可写的私有数据为例。地址与数值仅用于示意。</text><rect x="25" y="110" width="434" height="232" rx="9" fill="#f2f7f7" stroke="#c2d5d7"/><text x="44" y="144" class="label" text-anchor="start">fork 刚返回</text><rect x="41" y="173" width="166" height="54" rx="9" fill="#fff" stroke="#c2d5d7"/><text x="124" y="207" class="body" text-anchor="middle">父 · VA 0x4000</text><rect x="41" y="260" width="166" height="54" rx="9" fill="#fff" stroke="#c2d5d7"/><text x="124" y="294" class="body" text-anchor="middle">子 · VA 0x4000</text><rect x="298" y="209" width="138" height="67" rx="9" fill="#dff1ee" stroke="#c2d5d7"/><text x="367" y="236" class="body" text-anchor="middle">物理页 A</text><text x="367" y="261" class="note" text-anchor="middle">值 100</text><path d="M209 200L293 232" class="a"/><path d="M209 287L293 252" class="a"/><rect x="481" y="110" width="434" height="232" rx="9" fill="#f2f7f7" stroke="#c2d5d7"/><text x="500" y="144" class="label" text-anchor="start">子进程写入后</text><rect x="497" y="173" width="166" height="54" rx="9" fill="#fff" stroke="#c2d5d7"/><text x="580" y="207" class="body" text-anchor="middle">父 · VA 0x4000</text><rect x="497" y="260" width="166" height="54" rx="9" fill="#fff" stroke="#c2d5d7"/><text x="580" y="294" class="body" text-anchor="middle">子 · VA 0x4000</text><rect x="754" y="170" width="138" height="61" rx="9" fill="#dff1ee" stroke="#c2d5d7"/><text x="823" y="195" class="body" text-anchor="middle">物理页 A</text><text x="823" y="217" class="note" text-anchor="middle">值 100</text><path d="M665 200H749" class="a"/><rect x="754" y="257" width="138" height="61" rx="9" fill="#fbeddc" stroke="#c2d5d7"/><text x="823" y="282" class="body" text-anchor="middle">物理页 B</text><text x="823" y="304" class="note" text-anchor="middle">值 101</text><path d="M665 287H749" class="a"/><text x="30" y="378" class="note" text-anchor="start">箭头表示各进程页表中的映射。首次写入仍被共享的页时，内核为写入方建立私有副本。</text>
</svg>
