<svg xmlns="http://www.w3.org/2000/svg" width="940" height="365" viewBox="0 0 940 365" role="img" aria-labelledby="title desc">
<title id="title">一条前台外部命令的生命周期</title><desc id="desc">时间从左向右。Shell 保留自己的进程，子进程在 exec 成功后沿用原 PID。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536c7c"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203749}.title{font-weight:700;font-size:28px}.sub,.note{font-size:17px;fill:#485e6c}.body,.mono,.label{font-size:20px}.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-weight:700}.label{font-weight:700;fill:#165e5a}.a,.rail,.wait{stroke:#536c7c;stroke-width:2.5;fill:none;stroke-linejoin:round}.a{marker-end:url(#arrow)}.wait{stroke-dasharray:6 5}</style>
<rect width="940" height="365" rx="16" fill="#f9fbfb"/><text x="30" y="48" class="title" text-anchor="start">一条前台外部命令的生命周期</text><text x="30" y="84" class="sub" text-anchor="start">时间从左向右。Shell 保留自己的进程，子进程在 exec 成功后沿用原 PID。</text><text x="30" y="160" class="label" text-anchor="start">父进程</text><text x="30" y="185" class="note" text-anchor="start">Shell</text><text x="30" y="273" class="label" text-anchor="start">子进程</text><path d="M145 156H360" class="rail"/><path d="M360 156H758" class="wait"/><path d="M758 156H900" class="a"/><path d="M224 159L308 267H715" class="rail"/><path d="M715 267L791 159" class="a"/><circle cx="224" cy="156" r="6" fill="#19736b"/><text x="224" y="140" class="mono" text-anchor="middle">fork()</text><circle cx="381" cy="156" r="6" fill="#19736b"/><text x="381" y="140" class="mono" text-anchor="middle">waitpid()</text><circle cx="790" cy="156" r="6" fill="#19736b"/><text x="790" y="140" class="mono" text-anchor="middle">waitpid 返回</text><circle cx="417" cy="267" r="6" fill="#19736b"/><text x="417" y="251" class="mono" text-anchor="middle">execvp()</text><circle cx="708" cy="267" r="6" fill="#19736b"/><text x="708" y="251" class="mono" text-anchor="middle">退出</text><text x="356" y="196" class="note" text-anchor="start">等待指定子进程结束</text><text x="833" y="195" class="note" text-anchor="middle">显示提示符</text><text x="345" y="300" class="body" text-anchor="start">执行新程序，例如 ls -l</text><text x="30" y="340" class="note" text-anchor="start">exec 替换执行映像，退出留下终止状态，父进程取得状态并完成回收。</text>
</svg>
