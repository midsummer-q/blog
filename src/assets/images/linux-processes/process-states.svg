<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="title desc">
<title id="title">从状态变化读懂 ps</title><desc id="desc">R 包括正在执行和等待 CPU 的任务。下面列出三条常见路径。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536c7c"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203749}.title{font-weight:700;font-size:28px}.sub,.note{font-size:17px;fill:#485e6c}.body,.mono,.label{font-size:20px}.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-weight:700}.label{font-weight:700;fill:#165e5a}.a,.rail,.wait{stroke:#536c7c;stroke-width:2.5;fill:none;stroke-linejoin:round}.a{marker-end:url(#arrow)}.wait{stroke-dasharray:6 5}</style>
<rect width="940" height="400" rx="16" fill="#f9fbfb"/><text x="30" y="48" class="title" text-anchor="start">从状态变化读懂 ps</text><text x="30" y="84" class="sub" text-anchor="start">R 包括正在执行和等待 CPU 的任务。下面列出三条常见路径。</text><text x="30" y="146" class="label" text-anchor="start">等待输入</text><rect x="180" y="110" width="92" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="226" y="147" class="mono" text-anchor="middle">R</text><rect x="465" y="110" width="110" height="56" rx="9" fill="#dff1ee" stroke="#c2d5d7"/><text x="520" y="147" class="mono" text-anchor="middle">S / D</text><rect x="789" y="110" width="118" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="848" y="147" class="mono" text-anchor="middle">R</text><path d="M276 144H455" class="a"/><path d="M580 144H780" class="a"/><text x="366" y="131" class="note" text-anchor="middle">请求尚未就绪</text><text x="678" y="131" class="note" text-anchor="middle">等待条件满足</text><text x="30" y="228" class="label" text-anchor="start">暂停任务</text><rect x="180" y="192" width="92" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="226" y="229" class="mono" text-anchor="middle">R</text><rect x="465" y="192" width="110" height="56" rx="9" fill="#dff1ee" stroke="#c2d5d7"/><text x="520" y="229" class="mono" text-anchor="middle">T</text><rect x="789" y="192" width="118" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="848" y="229" class="mono" text-anchor="middle">R</text><path d="M276 226H455" class="a"/><path d="M580 226H780" class="a"/><text x="366" y="213" class="note" text-anchor="middle">收到 SIGSTOP</text><text x="678" y="213" class="note" text-anchor="middle">收到 SIGCONT</text><text x="30" y="310" class="label" text-anchor="start">结束进程</text><rect x="180" y="274" width="92" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="226" y="311" class="mono" text-anchor="middle">R</text><rect x="465" y="274" width="110" height="56" rx="9" fill="#dff1ee" stroke="#c2d5d7"/><text x="520" y="311" class="mono" text-anchor="middle">Z</text><rect x="789" y="274" width="118" height="56" rx="9" fill="#eef4f8" stroke="#c2d5d7"/><text x="848" y="311" class="mono" text-anchor="middle">已回收</text><path d="M276 308H455" class="a"/><path d="M580 308H780" class="a"/><text x="366" y="295" class="note" text-anchor="middle">运行结束</text><text x="678" y="295" class="note" text-anchor="middle">父进程 wait</text><text x="30" y="382" class="note" text-anchor="start">S 或 D 取决于内核等待方式。退出一行假定父进程按通常方式等待子进程。</text>
</svg>
