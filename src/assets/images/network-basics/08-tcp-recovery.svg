<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
  role="img"
  aria-label="08 / 缺失一个区间，累积确认在哪里停下？"
>
  <defs>
    <marker
      id="blue"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#2868b2" />
    </marker>
    <marker
      id="green"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#25816c" />
    </marker>
    <marker
      id="red"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#be4a4a" />
    </marker>
  </defs>
  <rect
    x="1"
    y="1"
    width="1198"
    height="718"
    rx="18"
    fill="#fff"
    stroke="#e4e9ef"
  />
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text
      x="48"
      y="60"
      font-size="34"
      fill="#18334f"
      text-anchor="start"
      font-weight="700"
    >
      08 / 缺失一个区间，累积确认在哪里停下？
    </text>
    <text
      x="48"
      y="100"
      font-size="22"
      fill="#546b83"
      text-anchor="start"
      font-weight="500"
    >
      三个 1000 字节区间；B 丢失，C 先到；全部数字为教学示例
    </text>
    <rect
      x="48"
      y="165"
      width="345"
      height="100"
      rx="14"
      fill="#edf8f3"
      stroke="#cad7e5"
    />
    <text
      x="220.5"
      y="207"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      A：[1001, 2001)
    </text>
    <text
      x="220.5"
      y="239"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="500"
    >
      已到达
    </text>
    <rect
      x="425"
      y="165"
      width="345"
      height="100"
      rx="14"
      fill="#fff0ee"
      stroke="#cad7e5"
    />
    <text
      x="597.5"
      y="207"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      B：[2001, 3001)
    </text>
    <text
      x="597.5"
      y="239"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="500"
    >
      缺失
    </text>
    <rect
      x="802"
      y="165"
      width="345"
      height="100"
      rx="14"
      fill="#edf4fc"
      stroke="#cad7e5"
    />
    <text
      x="974.5"
      y="207"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      C：[3001, 4001)
    </text>
    <text
      x="974.5"
      y="239"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="500"
    >
      乱序到达
    </text>
    <rect
      x="48"
      y="315"
      width="1100"
      height="140"
      rx="14"
      fill="#fff3dc"
      stroke="#cad7e5"
    />
    <text
      x="78"
      y="360"
      font-size="27"
      fill="#18334f"
      text-anchor="start"
      font-weight="700"
    >
      B 尚未补齐
    </text>
    <text
      x="78"
      y="403"
      font-size="26"
      fill="#2868b2"
      text-anchor="start"
      font-weight="500"
    >
      累积 ACK = 2001
    </text>
    <text
      x="610"
      y="403"
      font-size="26"
      fill="#25816c"
      text-anchor="start"
      font-weight="500"
    >
      SACK = [3001, 4001)
    </text>
    <line
      x1="600"
      y1="460"
      x2="600"
      y2="515"
      stroke="#2868b2"
      stroke-width="3"
      marker-end="url(#blue)"
    />
    <rect
      x="48"
      y="535"
      width="1100"
      height="75"
      rx="14"
      fill="#edf8f3"
      stroke="#cad7e5"
    />
    <text
      x="598"
      y="580.5"
      font-size="25"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      重传补齐 B 后：连续字节完整，累积 ACK 前进到 4001
    </text>
    <text
      x="48"
      y="655"
      font-size="21"
      fill="#546b83"
      text-anchor="start"
      font-weight="500"
    >
      ACK 表示 TCP 接收进度，不证明应用已经消费数据或完成业务。
    </text>
    <text
      x="1150"
      y="698"
      font-size="18"
      fill="#546b83"
      text-anchor="end"
      font-weight="500"
    >
      计算机网络通识 · 原创教学示意
    </text>
  </g>
</svg>
