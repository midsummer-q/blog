<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
  role="img"
  aria-label="10 / 双向字节流分别结束"
>
  <defs>
    <marker
      id="blue"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#2868b2" />
    </marker>
    <marker
      id="green"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#25816c" />
    </marker>
    <marker
      id="red"
      markerWidth="11"
      markerHeight="8"
      refX="10"
      refY="4"
      orient="auto"
    >
      <path d="M0,0 L11,4 L0,8 Z" fill="#be4a4a" />
    </marker>
  </defs>
  <rect
    x="1"
    y="1"
    width="1198"
    height="718"
    rx="18"
    fill="#fff"
    stroke="#e4e9ef"
  />
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text
      x="48"
      y="60"
      font-size="34"
      fill="#18334f"
      text-anchor="start"
      font-weight="700"
    >
      10 / 双向字节流分别结束
    </text>
    <text
      x="48"
      y="100"
      font-size="22"
      fill="#546b83"
      text-anchor="start"
      font-weight="500"
    >
      典型客户端先关闭路径；ACK 与 FIN 可以合并，并非固定四个报文
    </text>
    <rect
      x="65"
      y="145"
      width="230"
      height="65"
      rx="14"
      fill="#edf4fc"
      stroke="#cad7e5"
    />
    <text
      x="180"
      y="185.5"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      客户端
    </text>
    <rect
      x="905"
      y="145"
      width="230"
      height="65"
      rx="14"
      fill="#edf8f3"
      stroke="#cad7e5"
    />
    <text
      x="1020"
      y="185.5"
      font-size="24"
      fill="#18334f"
      text-anchor="middle"
      font-weight="700"
    >
      服务器
    </text>
    <line
      x1="180"
      y1="215"
      x2="180"
      y2="610"
      stroke="#cad7e5"
      stroke-width="3"
      stroke-dasharray="8 7"
    />
    <line
      x1="1020"
      y1="215"
      x2="1020"
      y2="610"
      stroke="#cad7e5"
      stroke-width="3"
      stroke-dasharray="8 7"
    />
    <line
      x1="185"
      y1="270"
      x2="1010"
      y2="270"
      stroke="#2868b2"
      stroke-width="3"
      marker-end="url(#blue)"
    />
    <text
      x="597.5"
      y="257"
      font-size="22"
      fill="#2868b2"
      text-anchor="middle"
      font-weight="500"
    >
      ① FIN：客户端不再发送
    </text>
    <text
      x="65"
      y="308"
      font-size="20"
      fill="#546b83"
      text-anchor="start"
      font-weight="500"
    >
      FIN_WAIT_1
    </text>
    <text
      x="1020"
      y="308"
      font-size="20"
      fill="#546b83"
      text-anchor="middle"
      font-weight="500"
    >
      CLOSE_WAIT
    </text>
    <line
      x1="1015"
      y1="365"
      x2="190"
      y2="365"
      stroke="#25816c"
      stroke-width="3"
      marker-end="url(#green)"
    />
    <text
      x="602.5"
      y="352"
      font-size="22"
      fill="#25816c"
      text-anchor="middle"
      font-weight="500"
    >
      ② ACK：确认客户端结束
    </text>
    <text
      x="180"
      y="398"
      font-size="20"
      fill="#546b83"
      text-anchor="middle"
      font-weight="500"
    >
      FIN_WAIT_2
    </text>
    <line
      x1="1015"
      y1="465"
      x2="190"
      y2="465"
      stroke="#25816c"
      stroke-width="3"
      marker-end="url(#green)"
    />
    <text
      x="602.5"
      y="452"
      font-size="22"
      fill="#25816c"
      text-anchor="middle"
      font-weight="500"
    >
      ③ FIN：服务器完成发送
    </text>
    <text
      x="1020"
      y="502"
      font-size="20"
      fill="#546b83"
      text-anchor="middle"
      font-weight="500"
    >
      LAST_ACK
    </text>
    <line
      x1="185"
      y1="560"
      x2="1010"
      y2="560"
      stroke="#2868b2"
      stroke-width="3"
      marker-end="url(#blue)"
    />
    <text
      x="597.5"
      y="547"
      font-size="22"
      fill="#2868b2"
      text-anchor="middle"
      font-weight="500"
    >
      ④ ACK：确认服务器结束
    </text>
    <text
      x="180"
      y="600"
      font-size="22"
      fill="#2868b2"
      text-anchor="middle"
      font-weight="700"
    >
      TIME_WAIT
    </text>
    <text
      x="1020"
      y="600"
      font-size="22"
      fill="#25816c"
      text-anchor="middle"
      font-weight="700"
    >
      CLOSED
    </text>
    <text
      x="48"
      y="655"
      font-size="21"
      fill="#546b83"
      text-anchor="start"
      font-weight="500"
    >
      收到 EOF 后仍可发送结果；RST 是异常重置，不是更快的正常关闭。
    </text>
    <text
      x="1150"
      y="698"
      font-size="18"
      fill="#546b83"
      text-anchor="end"
      font-weight="500"
    >
      计算机网络通识 · 原创教学示意
    </text>
  </g>
</svg>
