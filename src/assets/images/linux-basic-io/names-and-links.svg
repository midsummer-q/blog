<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="名字与对象：硬链接和符号链接"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52637b" stroke-width="1.5"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="32" font-weight="700" fill="#172b4d">名字与对象：硬链接和符号链接</text>
<text x="48" y="104" font-size="19" fill="#52637b">目录项记录名字；inode 描述文件对象；符号链接保存另一条路径。</text>
<rect x="48" y="165" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="204" font-size="23" font-weight="700" fill="#2563eb">original.txt</text>
<text x="70" y="242" font-size="20" fill="#172b4d">目录项 → inode 42</text>
<rect x="48" y="335" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="374" font-size="23" font-weight="700" fill="#2563eb">hard.txt</text>
<text x="70" y="412" font-size="20" fill="#172b4d">目录项 → inode 42</text>
<rect x="480" y="245" width="260" height="155" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="502" y="284" font-size="23" font-weight="700" fill="#0f766e">inode 42</text>
<text x="502" y="322" font-size="20" fill="#172b4d">链接计数：2</text>
<text x="502" y="354" font-size="20" fill="#172b4d">同一份普通文件</text>
<rect x="890" y="245" width="260" height="155" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="912" y="284" font-size="23" font-weight="700" fill="#0f766e">文件内容</text>
<text x="912" y="322" font-size="20" fill="#172b4d">hello inode</text>
<text x="912" y="354" font-size="20" fill="#172b4d">数据块 / 数据范围</text>
<path d="M 348 230 L 407 230 L 407 290 L 480 290" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 348 400 L 435 400 L 435 350 L 480 350" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 740 320 L 890 320" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="525" width="300" height="130" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="564" font-size="23" font-weight="700" fill="#2563eb">soft.txt</text>
<text x="70" y="602" font-size="20" fill="#172b4d">目录项 → inode 99</text>
<rect x="480" y="515" width="670" height="150" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="502" y="554" font-size="23" font-weight="700" fill="#2563eb">inode 99 · 符号链接</text>
<text x="502" y="592" font-size="20" fill="#172b4d">保存路径：original.txt</text>
<text x="502" y="624" font-size="20" fill="#172b4d">删除 original.txt 后，路径失效；hard.txt 仍可访问内容。</text>
<path d="M 348 590 L 480 590" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="724" font-size="16" fill="#64748b">基础 I/O · 概念示意图，非内核结构的完整布局</text></g></svg>