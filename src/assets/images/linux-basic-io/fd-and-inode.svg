<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="fd、打开状态与 inode 是三件事"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52637b" stroke-width="1.5"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="65" font-size="32" font-weight="700" fill="#172b4d">fd、打开状态与 inode 是三件事</text>
<text x="48" y="104" font-size="19" fill="#52637b">示例：open 返回 fd 3，再用 dup 复制得到 fd 4。</text>
<rect x="48" y="170" width="270" height="300" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="70" y="209" font-size="23" font-weight="700" fill="#2563eb">进程描述符表</text>
<text x="70" y="247" font-size="20" fill="#172b4d">0  →  标准输入</text>
<text x="70" y="279" font-size="20" fill="#172b4d">1  →  标准输出</text>
<text x="70" y="311" font-size="20" fill="#172b4d">2  →  标准错误</text>
<text x="70" y="343" font-size="20" fill="#172b4d">3  →</text>
<text x="70" y="375" font-size="20" fill="#172b4d">4  →</text>
<rect x="450" y="245" width="300" height="190" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="472" y="284" font-size="23" font-weight="700" fill="#2563eb">打开文件描述</text>
<text x="472" y="322" font-size="20" fill="#172b4d">共享的当前位置</text>
<text x="472" y="354" font-size="20" fill="#172b4d">共享的文件状态标志</text>
<text x="472" y="386" font-size="20" fill="#172b4d">Linux：struct file</text>
<rect x="870" y="245" width="280" height="190" rx="14" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="892" y="284" font-size="23" font-weight="700" fill="#0f766e">inode</text>
<text x="892" y="322" font-size="20" fill="#172b4d">文件类型、权限、大小</text>
<text x="892" y="354" font-size="20" fill="#172b4d">关联文件内容的位置</text>
<text x="892" y="386" font-size="20" fill="#172b4d">属于某个文件系统</text>
<path d="M 222 343 L 370 343 L 370 310 L 450 310" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 222 375 L 395 375 L 395 350 L 450 350" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 750 335 L 870 335" fill="none" stroke="#52637b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="52" y="550" font-size="20" fill="#52637b">dup 得到的两个 fd：共享同一份打开状态，因此也共享偏移量。</text>
<text x="52" y="582" font-size="20" fill="#52637b">同一文件两次 open：通常产生两份打开状态，但可以关联同一个 inode。</text>
<text x="52" y="614" font-size="20" fill="#52637b">fd 是进程内的访问编号；inode 号需要结合所属文件系统理解。</text>
<text x="48" y="724" font-size="16" fill="#64748b">基础 I/O · 概念示意图，非内核结构的完整布局</text></g></svg>